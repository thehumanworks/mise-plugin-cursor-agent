name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Unit tests
        run: bash scripts/run_tests.sh

  mise-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl -fsSL https://mise.jdx.dev/install.sh | sh

      - name: Integration (link, ls-remote, install, pinned id)
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          bash scripts/verify_mise.sh
          export PATH="${HOME}/.local/bin:${PATH}"
          DATA="${RUNNER_TEMP}/mise-ci"
          mkdir -p "$DATA"
          export MISE_DATA_DIR="$DATA"
          export MISE_STATE_DIR="$DATA/state"
          cd "$(mktemp -d)"
          mise plugin link cursor-agent "${GITHUB_WORKSPACE}"
          CUR="$(mise ls-remote cursor-agent | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+$' | head -1)"
          test -n "$CUR"
          mise install "cursor-agent@${CUR}"
          mise exec "cursor-agent@${CUR}" -- cursor-agent --version | grep -q "$CUR"
